[project]
name = "chintamani-gems"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7,<7", "watchdog>=4,<7", "openpyxl>=3.1,<4", "httpx>=0.27,<1", "keyring>=25,<26", "cryptography>=44,<47", "reportlab>=4,<5", "google-auth-oauthlib>=1.2,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]
[project.scripts]
chintamani-gems = "drc_sync.app:main"
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
pythonpath = ["."]
