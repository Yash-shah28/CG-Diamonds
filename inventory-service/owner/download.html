<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chintamani Gems private installer</title></head>
<body><main>
<h1>Download the Windows app</h1>
<form id="login"><label>Login ID <input id="login-id" autocomplete="username" required></label>
<label>Password <input id="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button></form>
<form id="change" hidden><label>New password <input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label>
<button>Set password</button></form>
<p id="status" role="status"></p>
<a id="download" rel="noreferrer" hidden>Download Windows installer</a>
</main><script src="/get-app.js" defer></script></body></html>
